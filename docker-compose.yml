services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-quincaillerie}
      POSTGRES_USER: ${POSTGRES_USER:-quincaillerie}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  app:
    image: node:22-alpine
    working_dir: /app
    restart: unless-stopped
    command: ["node", "server.js"]
    env_file: .env
    volumes:
      - ./:/app
    depends_on:
      - postgres
      - redis
    ports:
      - "4173:4173"

volumes:
  postgres_data:
